name: Publish Docs
on:
  push:
    branches:
      - main  # Triggers whenever you push code to main

# Permissions needed to push the generated site back to the gh-pages branch
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        # Installs MkDocs tools AND your package (so mkdocstrings can find the code)
        run: |
          pip install mkdocs-material "mkdocstrings[python]" mkdocs-include-markdown-plugin
          pip install -e .

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force