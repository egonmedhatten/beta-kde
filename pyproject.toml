[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beta-kde"
version = "0.1.1"
description = "Beta Kernel Density Estimation with automatic bandwidth selection, compatible with Scikit-learn"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "BSD-3-Clause"}
authors = [
  {name="Johan Hallberg Szabadvary", email="johan.hallberg.szabadvary@ju.se" },
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "matplotlib>=3.0",  # Optional, but used in plot methods
    "tqdm"              # Optional
]
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
"Homepage" = "https://github.com/egonmedhatten/beta-kde"

# --- NEW SECTION ---
[tool.pytest.ini_options]
# Always run with coverage for the src/beta_kde package and show missing lines
addopts = "--cov=src/beta_kde --cov-report=term-missing"
testpaths = ["tests"]